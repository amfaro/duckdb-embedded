# Propose same-major RWX package updates for every top-level .rwx/*.yml file.
# rwx/update-packages-github opens one PR on an rwx-update-* branch and enables
# auto-merge; .github/workflows/rwx-update-auto-approve.yml approves it only
# when the diff is pin-only.
on:
  cron:
    - key: update-rwx-packages-weekly
      schedule: '0 10 * * 1'

  dispatch:
    key: duckdb-embedded-update-rwx-packages

  cli: {}

concurrency-pools:
  - id: amfaro/duckdb-embedded:update-rwx-packages
    capacity: 1
    on-overflow: queue

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: update
    call: rwx/update-packages-github 2.2.0
    with:
      repository: https://github.com/amfaro/duckdb-embedded.git
      # Always the trusted default branch, whatever ref started the run.
      ref: main
      github-token: ${{ vaults.rwx-github-workflows.github-apps.amfaro-rwx-workflows-management.token }}
      allow-major-version-change: false
      enable-auto-merge: true
