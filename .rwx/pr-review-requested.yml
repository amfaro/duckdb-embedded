# Posts the Slack review request and moves the PR's linked issues to Code
# review. Dispatched by .github/workflows/pr-review-requested-slack.yml.
on:
  dispatch:
    key: duckdb-embedded-pr-review-requested
    params:
      - {key: pr-number, required: true}
      - {key: reviewer, required: false}
    init:
      pr-number: ${{ event.dispatch.params.pr-number }}
      reviewer: ${{ event.dispatch.params.reviewer }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: review-requested
    call: gmatter/review-requested 1.0.0
    with:
      pr-number: ${{ init.pr-number }}
      reviewer: ${{ init.reviewer }}
      repository: amfaro/duckdb-embedded
      channel: calc-dev
      github-token: ${{ vaults.rwx-github-workflows.github-apps.amfaro-rwx-workflows-management.token }}
      slack-token: ${{ vaults.duckdb-embedded.secrets.SLACK_BOT_TOKEN }}
