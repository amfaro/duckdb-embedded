# Pull request checks: actionlint for the remaining GitHub Actions shims and
# shellcheck for the mise tasks. No vault access, so it is safe for PR code.
on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}

  github:
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/amfaro/duckdb-embedded.git
      ref: ${{ init.commit-sha }}

  - key: mise
    use: code
    call: gmatter/setup-mise 1.1.0
    filter:
      - mise.toml
    with:
      tools: actionlint,shellcheck

  - key: lint
    use: mise
    run: mise run lint
