# Inlined: this public repo cannot use the private amfaro/actions.
# RWX has no review_requested trigger, so this only dispatches
# .rwx/pr-review-requested.yml.
name: pr-review-requested-slack

on:
  pull_request:
    types: [review_requested]

concurrency:
  group: >-
    pr-review-slack-${{ github.event.pull_request.number }}-${{ github.event.requested_reviewer.login }}
  cancel-in-progress: true

permissions: {}

jobs:
  dispatch:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Fetch secrets from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: duckdb-embedded
          doppler-config: prod
          inject-env-vars: false

      - uses: jdx/mise-action@v5
        with:
          install: false

      - name: Dispatch RWX run
        env:
          RWX_ACCESS_TOKEN: ${{ steps.doppler.outputs.RWX_DISPATCH_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWER: ${{ github.event.requested_reviewer.login }}
        run: >-
          mise exec github:rwx-cloud/rwx@3.35.0 --
          rwx dispatch duckdb-embedded-pr-review-requested --ref main
          --param "pr-number=$PR_NUMBER" --param "reviewer=$REVIEWER"
