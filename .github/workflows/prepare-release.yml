name: prepare-release

on:
  push:
    branches:
      - main
    paths-ignore:
      - VERSION

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: amfaro/actions/setup-mise@v1
        with:
          install: false

      - name: Prepare release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run release:prepare
