# Inlined: this public repo cannot use the private amfaro/actions.
# RWX has no macOS runners, so this builds only the macOS archive, then
# dispatches .rwx/release.yml, which builds Linux, publishes, and notifies calc.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to validate and exercise (e.g. v1.3.2-99)"
        required: true
        type: string
      publish_release:
        description: "Publish the GitHub release and push the runtime image"
        required: true
        default: false
        type: boolean
      dispatch_consumers:
        description: "Dispatch the embedded release event to calc"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v5
        env:
          MISE_ENV: ci
          MISE_JOBS: "1"
        with:
          install_args: cmake ninja rust

      - name: Build custom shared libduckdb
        run: mise run build-duckdb

      - name: Package release archive
        run: mise run package-release-artifact libduckdb.dylib libduckdb-osx-arm64.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: libduckdb-osx-arm64.zip
          path: libduckdb-osx-arm64.zip
          if-no-files-found: error

  dispatch-rwx:
    needs: build-macos
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Fetch secrets from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: duckdb-embedded
          doppler-config: prod
          inject-env-vars: false

      - uses: jdx/mise-action@v5
        with:
          install: false

      - name: Dispatch RWX run
        env:
          RWX_ACCESS_TOKEN: ${{ steps.doppler.outputs.RWX_DISPATCH_TOKEN }}
          # Tag pushes load the RWX definitions from main; manual runs use their branch.
          RWX_REF: ${{ github.ref_type == 'tag' && 'main' || github.ref_name }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish_release }}
          DISPATCH_CONSUMERS: ${{ github.event_name == 'push' || inputs.dispatch_consumers }}
        run: >-
          mise exec github:rwx-cloud/rwx@3.35.0 --
          rwx dispatch duckdb-embedded-release --ref "$RWX_REF"
          --title "release $RELEASE_TAG"
          --param "release-tag=$RELEASE_TAG"
          --param "commit-sha=$GITHUB_SHA"
          --param "macos-run-id=$GITHUB_RUN_ID"
          --param "publish-release=$PUBLISH_RELEASE"
          --param "dispatch-consumers=$DISPATCH_CONSUMERS"
