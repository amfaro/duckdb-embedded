# Approves pin-only rwx-update-* PRs from .rwx/update-rwx-packages.yml.
# pull_request_target loads this file and the pinned shared gate from the base
# branch, so a PR cannot change the gate that judges it.
name: rwx-update-auto-approve
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: rwx-update-auto-approve-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approve:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: amfaro/actions/rwx-update-auto-approve@v1
